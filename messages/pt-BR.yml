# prumo — catálogo em português do Brasil.
#
# Traduzido de `en.yml`, que é a referência. Chave que falta aqui é defeito, não
# degradação: cair no inglês em silêncio faria um relatório meio traduzido parecer
# pronto, e quem lê não teria como saber.
#
# Os placeholders são `{nomeados}` e carregam o MESMO nome do catálogo inglês — a ordem
# na frase muda, o nome não. Todo texto recebe as DUAS formas do item e da proposta —
# nua (`{item}`) e com artigo (`{item_with_article}`) — e cada catálogo usa a que a sua
# língua pede: o inglês a nua, o português a com artigo, porque tem gênero.

agnosticism:
  failure_forbidden: '"{file}:{line}: {label} `{match}`"'
  failure_repo_name: '"{file}:{line}: nome de repositório `{repo}`"'
  families_note: '"{n} famílias com perfil: {detail}"'
  header: '{n} arquivos de método verificados · {classes} classes'
  more_failures: '"… e mais {n} (use --verbose)"'
  no_profiles: nenhum perfil em review-profiles/ — derive-os antes
  profile_error: '"{file}: {error}"'
  rule_1: o método não nomeia repositório, stack, ferramenta, armazenamento ou id de item
  rule_2: todo perfil valida contra o contrato
  rule_3: a suíte passa
  rule_4: há perfil em mais de uma família de stack
  rule_4_note: A regra 4 completa — rodar de ponta a ponta sobre uma proposta de duas famílias
    — exige uma proposta de verdade e não se fecha neste ambiente.
  single_family: '"só uma família de stack tem perfil: {families}"'
cli:
  name_repo_or_all: informe um repositório, ou use --all
class_question:
  A1: um artefato de esquema já aplicado foi editado?
  A2: a forma de um contrato de saída mudou?
  A3: uma cláusula de escopo de autorização ou de inquilino foi tocada?
  A4: uma superfície de integração mudou?
  A5: uma regra de negócio mudou?
  A6: uma camada ou fronteira foi introduzida, ou uma dependência invertida?
  A7: o código afirma um fato que a especificação não tem, ou contradiz um que ela tem?
  A8: um teste foi removido ou enfraquecido?
  A9: um segredo, uma credencial ou material de chave entrou?
  A10: um caminho quente foi tocado com efeito em volume?
  B1: um artefato derivado, observável só executando, foi afetado?
  B2: uma integração com sistema legado interno foi tocada?
  B3: um fornecedor externo foi tocado?
  B4: um agregado que atravessa dois armazenamentos mudou?
  B5: uma tela, um fluxo ou texto de interface mudou?
  B6: há migração de dados, e não só de esquema?
  B7: há comportamento que só aparece em volume?
  B8: a entrega chega à produção por um processo formal?
