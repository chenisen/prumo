# prumo — English catalogue. This is the reference: every other catalogue is compared
# against it key by key, and a missing key is a defect, not a fallback.
#
# Placeholders are `{named}`, never positional: a translator reordering a sentence must
# not have to track argument order. A placeholder the caller does not pass raises, so an
# unfilled `{brace}` never reaches a published report.

agnosticism:
  failure_forbidden: '"{file}:{line}: {label} `{match}`"'
  failure_repo_name: '"{file}:{line}: repository name `{repo}`"'
  families_note: '"{n} families with a profile: {detail}"'
  header: '{n} method files checked · {classes} classes'
  more_failures: '"… and {n} more (use --verbose)"'
  no_profiles: no profile in review-profiles/ — derive them first
  profile_error: '"{file}: {error}"'
  rule_1: the method names no repository, stack, tool, storage or item id
  rule_2: every profile validates against the contract
  rule_3: the suite passes
  rule_4: there is a profile in more than one stack family
  rule_4_note: The complete rule 4 — running end to end over a proposal from two families — needs
    a real proposal and does not close in this environment.
  single_family: '"only one stack family has a profile: {families}"'
cli:
  name_repo_or_all: name a repository, or use --all
class_question:
  A1: was an already-applied schema artefact edited?
  A2: did the shape of an outbound contract change?
  A3: was an authorisation-scope or tenant clause touched?
  A4: did an integration surface change?
  A5: did a business rule change?
  A6: was a layer or boundary introduced, or a dependency inverted?
  A7: does the code state a fact the specification does not hold, or contradict one it does?
  A8: was a test removed or weakened?
  A9: did a secret, a credential or key material get in?
  A10: was a hot path touched with an effect at volume?
  B1: was a derived artefact, observable only by running, affected?
  B2: was an integration with a legacy internal system touched?
  B3: was an external provider touched?
  B4: did an aggregate spanning two stores change?
  B5: did a screen, a flow or interface text change?
  B6: is there a data migration, not only a schema one?
  B7: is there behaviour that only shows up at volume?
  B8: does the delivery reach production through a formal process?
