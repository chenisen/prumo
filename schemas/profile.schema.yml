
# Validado por .claude/skills/task-review/scripts/validar_perfil.py
#

$schema: "https://json-schema.org/draft/2020-12/schema"
title: A repository's review profile
type: object
additionalProperties: false
required: [profile, version, status, stack, conventions, proof_registry, base,
           living_docs, checks, sensitive_data, size, anchors, evals]

properties:
  profile:
    type: string
    minLength: 1
    description: name of the repository this profile applies to
  version:
    type: integer
    minimum: 1
  status:
    enum: [draft, confirmed]
  confirmed_by:
    type: [string, "null"]
  confirmed_at:
    type: [string, "null"]
    description: date ISO-8601 (AAAA-MM-DD)

  stack:
    type: object
    additionalProperties: false
    required: [family, manifests]
    properties:
      family:
        type: string
        description: free label for this repo's stack family; only the profile interprets it
      manifests:
        type: array
        items: {type: string}

  conventions:
    type: array
    description: POINTERS to the repo's convention documents, read at runtime. An empty list is legitimate.
    items: {type: string}

  proof_registry:
    type: object
    additionalProperties: false
    required: [type, root, note]
    properties:
      type:
        # A FREE label, not an enum. The enum named one company's specification framework
        # empresa dentro do contrato de todas — o mesmo acoplamento que o profile existe
        # The only value the method gives meaning to is `absent`, which leaves class A7

        # 
        type: string
        minLength: 1
      root: {type: [string, "null"]}
      note: {type: [string, "null"]}

  base:
    type: object
    additionalProperties: false
    required: [branch]
    properties:
      branch: {type: string, minLength: 1}

  living_docs:
    type: array
    description: what class A4 requires updating when an integration surface changes
    items: {type: string}

  checks:
    type: object
    additionalProperties: false
    required: [secrets, static, lint, dependencies, suite]
    properties:
      secrets:     {$ref: "#/$defs/check"}
      static:     {$ref: "#/$defs/check"}
      lint:         {$ref: "#/$defs/check"}
      dependencies: {$ref: "#/$defs/check"}
      suite:        {$ref: "#/$defs/check"}

  sensitive_data:
    type: object
    additionalProperties: false
    required: [fields, forbidden_destinations]
    properties:
      fields: {type: array, items: {type: string}}
      forbidden_destinations: {type: array, items: {type: string}}

  size:
    type: object
    additionalProperties: false
    required: [ideal, acceptable, split, file_ceiling]
    properties:
      ideal: {type: integer, minimum: 1}
      acceptable: {type: integer, minimum: 1}
      split: {type: integer, minimum: 1}
      file_ceiling: {type: integer, minimum: 1}
      production_acceptable:
        type: integer
        minimum: 1
        description: >
          cap on PRODUCTION lines for the `standard` effort level — above it the review
          is `full`. Optional; defaults to `acceptable`. A number this repository tunes,
          never a name.

  local_reviewer:
    type: [object, "null"]
    additionalProperties: false
    required: [type, nome]
    properties:
      type: {enum: [agent, skill]}
      nome: {type: string}

  models:
    type: [object, "null"]
    description: rebaixamento opcional de modelo por agente, num repo de baixo risco
    additionalProperties: {enum: [haiku, sonnet, opus]}

  delivery:
    type: object
    description: >
      What `deliver` needs to write into THIS repository and prove it. OPTIONAL: a
      profile without it makes every delivery `not_assessable`, with the derivation
      command handed back — never a default. Nothing here names a stack: the suite is
      `checks.suite`, the base is `base.branch`.
    additionalProperties: false
    required: [branch_format, commit_format, source_roots, test_roots, mutation, kinds]
    properties:
      branch_format:
        type: string
        minLength: 1
        description: "how the branch is named; `{item}` and `{slug}` are filled in"
      commit_format:
        type: string
        minLength: 1
        description: "the repository's commit convention; `{item}` and `{message}` are filled in"
      worktree:
        type: boolean
        description: >
          Every item is delivered in a worktree of its own inside the repository — the
          person's checkout is never touched, and several items are delivered at once.
          That is the default, and `true` only says it again. `false` is the opt-out of a
          repository whose suite cannot reach a worktree, and each prepare says so.
      worktree_setup:
        type: array
        items: {type: string, minLength: 1}
        description: >
          Commands the script runs INSIDE a fresh worktree, one at a time, by `shlex`,
          with no shell composition — the same rule as `checks`. `{repo}` is the main
          checkout and `{worktree}` the worktree. Nothing runs that is not declared here:
          a dependency tree a build left outside git, a cache directory a framework
          wants writable, are facts of THIS repository, and they are written here.
      path_map:
        type: [object, "null"]
        additionalProperties: false
        required: [host, container]
        properties:
          host: {type: string, minLength: 1}
          container: {type: string, minLength: 1}
        description: >
          How the executor sees the checkout: `host` is the checkout's path here, and
          `container` the path the same directory is mounted at where the commands run.
          It is what lets `{workdir}` in `checks.suite`, `checks.lint` and
          `delivery.mutation` name a worktree the executor can reach — the worktree's
          path relative to `host`, under `container`. Absent, `{workdir}` is the host path.
      budget:
        type: object
        additionalProperties: false
        required: [max_files, max_lines]
        properties:
          max_files: {type: integer, minimum: 1}
          max_lines: {type: integer, minimum: 1}
        description: >-
          OPTIONAL, and a decision of the repository's — never drafted, never defaulted. Declared,
          a delivery over it stops and proposes the split, and `waiver` lifts it, with a name and
          an expiry. Absent, no delivery stops for its size: the plan says no budget is declared.
          Read as the profile stands when `conclude` runs, so raising or removing it is heard by
          the next conclude of the same package.
      small:
        type: object
        additionalProperties: false
        properties:
          max_files: {type: integer, minimum: 1}
          max_lines: {type: integer, minimum: 1}
        description: >
          Up to where a delivery is SMALL in this repository (3 files and 80 lines when
          absent). A small delivery on a shape with no gate is checked by the test files
          it touched, with no sceptic; anything larger runs the whole suite, once.
      wide_paths:
        type: array
        items: {type: string, minLength: 1}
        description: >
          Globs of what everything else leans on — a shared kernel, a base class, a
          build or dependency manifest, a schema migration. A change that touches one is
          never small, however few lines it has: it runs the whole suite.
      evidence:
        type: [object, "null"]
        additionalProperties: false
        required: [how]
        properties:
          how:
            type: string
            minLength: 1
            description: >
              how a change is SHOWN to a person in this repository — a screen captured, an
              exchange recorded, a command's output kept — in the words of whoever does it
          setup:
            type: array
            items: {type: string, minLength: 1}
            description: what raises the environment the showing needs; run by the collector, at that stage only
          teardown:
            type: array
            items: {type: string, minLength: 1}
            description: what takes that environment down again
        description: >
          How a finished delivery is illustrated. Read ONCE per item, after its last task
          is delivered, by the `evidence` stage — never while the work is being written,
          and nothing it finds changes the delivery's state. Absent, the tests are the
          evidence and nothing is raised.
      source_roots:
        type: array
        minItems: 1
        items: {type: string}
        description: where production lives; a line outside the scope is a defect
      test_roots:
        type: array
        minItems: 1
        items: {type: string}
      doc_roots:
        type: array
        items: {type: string}
        description: >
          where documentation lives (a directory or a single file); a behaviour change or a
          refactor may update it when the measurement names the file — a coverage gap never
      generated:
        type: array
        items: {type: string}
        description: >
          globs of files a tool writes, never a person (a dependency lock, say); named in
          the measurement they are in scope wherever they sit, and their lines stay out of
          the budget — the budget measures what a reviewer reads
      mutation:
        type: object
        additionalProperties: false
        required: [command, note]
        properties:
          command:
            type: [string, "null"]
            description: >
              null means by hand — the script edits the named line, runs the suite,
              reverts. `{workdir}` is accepted here the way `checks` accept it.
          note: {type: [string, "null"]}
      hotfix_base:
        type: [string, "null"]
        description: the branch a hotfix is cut from and measured against — production's, not the default base
      kinds:
        type: array
        description: the kinds THIS repository accepts, from reference/delivery-kinds.md; anything else is unsupported
        items: {enum: [coverage-gap, behaviour-change, refactor]}
      waiver: {$ref: "#/$defs/waiver"}

  anchors:
    type: object
    description: >
      Amarra as 18 classes a ESTE repo. Classe absent do mapa fica `nao_avaliavel`.
      A class that demonstrably does not apply uses `not_applicable`, with a reason and an approver.
    propertyNames:
      pattern: "^[AB](10|[1-9])$"
    additionalProperties:
      oneOf:
        - $ref: "#/$defs/anchor"
        - $ref: "#/$defs/not_applicable"

  evals:
    type: array
    description: THIS repo's eval set — one case per incident that has already cost something
    items:
      type: object
      additionalProperties: false
      required: [item, class, expects]
      properties:
        item: {type: [integer, string]}
        class:
          type: string
          pattern: "^([AB](10|[1-9])|nenhuma)$"
        expects: {enum: [fire, silence]}
        nota: {type: [string, "null"]}

  pending:
    type: array
    description: classes that already came out `not_assessable` in a real run; the profile's work list
    items:
      type: object
      additionalProperties: false
      required: [class, visto_em]
      properties:
        class: {type: string, pattern: "^[AB](10|[1-9])$"}
        visto_em: {type: string}
        nota: {type: [string, "null"]}

$defs:
  check:
    type: object
    additionalProperties: false
    required: [command, required]
    properties:
      command:
        type: [string, "null"]
        description: >
          null means the role has no tool in this repo — it becomes an absent capability.
          `{workdir}` names the tree the command runs over — the delivery's worktree, or
          the checkout — translated through `delivery.path_map`; the allowlist checks the
          template, and the substitution happens after, before the run.
      required: {type: boolean}
      preexisting_reds:
        type: [string, "null"]
        description: the baseline, described BY NAME; a count discriminates no delivery at all
      failure_pattern:
        type: [string, "null"]
        description: >
          A regular expression that, matching the OUTPUT, proves the check failed — even
          when the exit code is 0. It exists because anything that wraps the process
          (container, runner, wrapper) can swallow the code, and a green resting on the
          exit code alone is a green that never looked at the result. Absent is
          legitimate: the state then says, in words, that it rests on the exit code only.
      success_pattern:
        type: [string, "null"]
        description: >
          A regular expression that, matching the OUTPUT, proves the check actually ran
          over something. Without a match the run is `not_run`, never green — whatever
          the exit code. Measured on 2026-11-19: seventeen secrets scans in a row came out
          green while the container had failed to mount the repository, or had found
          four leaks, because the wrapper returned 0 either way. `failure_pattern` wins
          over it.
      red_name_pattern:
        type: [string, "null"]
        description: >
          A regular expression with ONE group that, over the OUTPUT, names each red test.
          It is what lets a baseline be compared BY NAME: without it a red is a count,
          and a count tells no delivery apart from another.
      progress_pattern:
        type: [string, "null"]
        description: >
          A regular expression with TWO groups, executed and predicted, over the OUTPUT.
          A suite whose executed is short of its predicted did not finish, and did not
          prove anything — whatever its exit code says.
      files_command:
        type: [string, "null"]
        description: >
          The suite over named test files only, with `{tests}` where the paths go (each
          quoted). It is what the writer runs while it works, what a small delivery is
          checked by, and what the proof — the red on the base, a mutant — runs over.
          Absent, the whole suite runs in each of those places, and a small item pays
          for the largest.
      test_files:
        type: array
        items: {type: string, minLength: 1}
        description: >
          Globs naming what a test FILE is called in this repository, among everything
          under `delivery.test_roots`. A fixture or a helper changed beside the tests is
          not handed to the runner. Absent, every changed file under a test root is.
      timeout_seconds:
        type: [integer, "null"]
        minimum: 1
        description: >
          How long the check may run before it counts as not run. Absent keeps the
          method's 900 s; a suite that takes longer on the base itself declares its own.
      waiver: {$ref: "#/$defs/waiver"}

  anchor:
    type: object
    additionalProperties: false
    properties:
      paths: {type: array, items: {type: string}}
      patterns:
        type: array
        description: expressões regulares aplicadas ao conteúdo do diff, quando o caminho não basta
        items: {type: string}
      verification:
        type: [string, "null"]
        description: como uma pessoa prova — obrigatório em classes §B
      cards: {type: array, items: {type: [integer, string]}}
      nota: {type: [string, "null"]}

  not_applicable:
    type: object
    additionalProperties: false
    required: [not_applicable]
    properties:
      not_applicable:
        type: object
        additionalProperties: false
        required: [reason, approver, date]
        properties:
          reason: {type: string, minLength: 1}
          approver: {type: string, minLength: 1}
          date: {type: string}

  waiver:
    type: [object, "null"]
    additionalProperties: false
    required: [reason, approver, expires]
    properties:
      reason: {type: string, minLength: 1}
      approver: {type: string, minLength: 1}
      expires: {type: string}
